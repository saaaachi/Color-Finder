<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Finder - Max Revenue</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1299640300068792" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0f172a; font-family: sans-serif; color: white; 
            overflow: hidden; position: fixed;
        }
        
        /* 上部広告：100px固定 */
        #ad-top-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100px; 
            background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; 
        }

        /* メインコンテナ */
        #game-outer {
            position: absolute; top: 100px; bottom: 0; left: 0; right: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; z-index: 10; background: #1e293b;
        }
        
        #ui { margin-bottom: 15px; font-size: 22px; font-weight: bold; color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); }
        
        #grid { 
            display: grid; gap: 6px; 
            width: 100%; max-width: 340px;
            aspect-ratio: 1/1; 
            margin: auto;
        }
        .tile { border-radius: 10px; cursor: pointer; transition: transform 0.1s; }
        .tile:active { transform: scale(0.95); opacity: 0.8; }

        /* メニュー・リザルト画面 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 200; padding: 10px;
        }

        /* リザルト用 300x250 広告枠 */
        #ad-middle-box {
            width: 300px; height: 250px; background: #000; margin: 15px 0;
            display: none; justify-content: center; align-items: center; 
            border-radius: 10px; overflow: hidden; border: 1px solid #334155;
        }

        /* 5秒全画面広告 */
        #inter-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; align-items: center; justify-content: center; }
        .inter-content { width: 330px; height: 330px; background: #fff; position: relative; border-radius: 8px; }
        #close-ad-btn { position: absolute; top: -50px; right: 0px; width: 45px; height: 45px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; border: 2px solid #fff; cursor: pointer; }

        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .menu-btn { 
            padding: 15px 0; font-size: 18px; border: none; border-radius: 50px; 
            color: white; font-weight: bold; cursor: pointer; text-decoration: none; 
            width: 260px; text-align: center; transition: 0.2s; 
        }
        #goButton { background: #22c55e; box-shadow: 0 4px #16a34a; }
        #goButton:disabled { background: #475569; box-shadow: none; opacity: 0.7; cursor: default; }
        .link-btn { background: #3b82f6; box-shadow: 0 4px #2563eb; }
        .best-info { color: #4ade80; font-size: 18px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ad-top-container">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="3972022911"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="game-outer">
        <div id="ui">LEVEL: <span id="lv">1</span></div>
        <div id="grid"></div>
        
        <div id="menuScreen">
            <div style="text-align:center;">
                <h2 id="menuTitle" style="color:#22c55e; margin:0; font-size: 32px;">COLOR FINDER</h2>
                <div class="best-info">BEST: LV <span id="best-ui">1</span></div>
            </div>

            <div id="ad-middle-box">
                <ins class="adsbygoogle"
                     style="display:inline-block;width:300px;height:250px"
                     data-ad-client="ca-pub-1299640300068792"
                     data-ad-slot="9050127185"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="btn-group">
                <button id="goButton" class="menu-btn" onclick="startNewGame()">GAME START</button>
                <a href="https://saaaachi.github.io/" class="menu-btn link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div id="inter-screen">
        <div class="inter-content">
            <div id="close-ad-btn" onclick="closeInterAd()">5</div>
            <iframe id="ifr-inter" src="about:blank" style="width:100%; height:100%; border:none; border-radius:8px; background: #fff;"></iframe>
        </div>
    </div>

    <script>
        const grid = document.getElementById("grid"),
              lvDisp = document.getElementById("lv"),
              menuScreen = document.getElementById("menuScreen"),
              menuTitle = document.getElementById("menuTitle"),
              bestUi = document.getElementById("best-ui"),
              goButton = document.getElementById("goButton"),
              adMid = document.getElementById("ad-middle-box");

        let level = 1, playCount = 0;
        let bestLevel = localStorage.getItem("color_finder_best") || 1;
        bestUi.innerText = bestLevel;

        function startNewGame() {
            menuScreen.style.display = "none";
            adMid.style.display = "none";
            level = 1;
            initLevel();
        }

        function initLevel() {
            lvDisp.innerText = level;
            grid.innerHTML = "";
            const side = Math.min(8, 2 + Math.floor(level / 3)); // 最大8x8まで拡大
            grid.style.gridTemplateColumns = `repeat(${side}, 1fr)`;
            
            const h = Math.floor(Math.random() * 360);
            const s = 50 + Math.floor(Math.random() * 30);
            const l = 40 + Math.floor(Math.random() * 20);
            const diff = Math.max(1.5, 12 - (level * 0.3)); // 難易度調整
            const targetIdx = Math.floor(Math.random() * (side * side));

            for(let i = 0; i < side * side; i++) {
                const tile = document.createElement("div");
                tile.className = "tile";
                if(i === targetIdx) {
                    tile.style.backgroundColor = `hsl(${h}, ${s}%, ${l + diff}%)`;
                    tile.onpointerdown = (e) => { 
                        e.preventDefault(); 
                        level++; 
                        if(level > bestLevel) { 
                            bestLevel = level; 
                            localStorage.setItem("color_finder_best", bestLevel); 
                            bestUi.innerText = bestLevel; 
                        } 
                        initLevel(); 
                    };
                } else {
                    tile.style.backgroundColor = `hsl(${h}, ${s}%, ${l}%)`;
                    tile.onpointerdown = (e) => { e.preventDefault(); gameOver(); };
                }
                grid.appendChild(tile);
            }
        }

        function gameOver() {
            playCount++;
            menuTitle.innerText = "GAME OVER";
            menuTitle.style.color = "#ef4444";
            
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;
            adMid.style.display = "flex"; 
            menuScreen.style.display = "flex";

            // 1.5秒ガード
            setTimeout(() => {
                goButton.disabled = false;
                goButton.innerText = "RETRY";
            }, 1500);

            // 2-5-8 収益サイクル
            if (playCount === 2 || (playCount >= 5 && (playCount - 2) % 3 === 0)) {
                setTimeout(showInterAd, 500);
            }
        }

        function showInterAd() {
            const screen = document.getElementById("inter-screen"), closeBtn = document.getElementById("close-ad-btn"), ifr = document.getElementById('ifr-inter');
            ifr.src = './ad.large.html?v=' + Date.now();
            screen.style.display = "flex";
            let timer = 5;
            closeBtn.innerText = timer; closeBtn.style.pointerEvents = "none"; closeBtn.style.background = "#555";
            const countdown = setInterval(() => {
                timer--;
                if (timer > 0) closeBtn.innerText = timer;
                else {
                    clearInterval(countdown);
                    closeBtn.innerText = "×";
                    closeBtn.style.background = "#ff4444";
                    closeBtn.style.pointerEvents = "auto";
                }
            }, 1000);
        }

        function closeInterAd() {
            document.getElementById("inter-screen").style.display = "none";
            document.getElementById('ifr-inter').src = 'about:blank';
        }
    </script>
</body>
</html>
